<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="장지원의 개인 홈페이지" />
    <title>장지원 | 개인 홈페이지</title>
    <style>
      :root { --blue: #3e6ae1; --carbon: #171a20; --graphite: #393c41; --pewter: #5c5e62; --ash: #f4f4f4; --white: #fff; --line: #eee; --nav-bg: rgba(255, 255, 255, .75); }
      [data-theme="dark"] { --carbon: #fff; --graphite: #e1e2e4; --pewter: #b6b8bc; --ash: #22252b; --white: #171a20; --line: #393c41; --nav-bg: rgba(23, 26, 32, .75); }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--carbon); font-family: "Universal Sans Text", -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 400; }
      a { color: inherit; text-decoration: none; }
      .nav { position: fixed; z-index: 10; top: 0; left: 0; display: flex; width: 100%; height: 56px; align-items: center; justify-content: space-between; padding: 0 32px; background: var(--nav-bg); backdrop-filter: blur(12px); }
      .wordmark { font-size: 16px; font-weight: 500; letter-spacing: .18em; }
      .nav-links { display: flex; gap: 4px; }
      .nav-links a { min-height: 32px; padding: 8px 16px; border-radius: 4px; font-weight: 500; transition: color .33s, background-color .33s; }
      .nav-links a:hover { background: rgba(23, 26, 32, .06); }
      .theme-toggle { min-height: 32px; padding: 4px 16px; border: 0; border-radius: 4px; color: var(--carbon); background: transparent; font: inherit; font-weight: 500; cursor: pointer; transition: color .33s, background-color .33s; }
      .theme-toggle:hover { background: rgba(128, 128, 128, .16); }
      .hero { position: relative; display: grid; min-height: 100vh; place-items: center; overflow: hidden; color: var(--white); text-align: center; background: #171a20 url("assets/seoul-hero.png") center / cover no-repeat; }
      .hero::before { position: absolute; inset: 0; content: ""; background: rgba(23, 26, 32, .33); }
      .hero-content { position: relative; z-index: 1; display: flex; width: min(100% - 32px, 680px); flex-direction: column; align-items: center; padding-top: 56px; }
      h1, h2 { font-family: "Universal Sans Display", -apple-system, Arial, sans-serif; font-weight: 500; }
      h1 { margin: 0; font-size: 40px; line-height: 1.2; }
      .hero p { margin: 12px 0 0; font-size: 16px; line-height: 1.43; }
      .actions { display: flex; gap: 8px; margin-top: 30px; }
      .button { display: inline-flex; width: 200px; min-height: 40px; align-items: center; justify-content: center; border: 3px solid transparent; border-radius: 4px; font-weight: 500; transition: border-color .33s, background-color .33s, color .33s; }
      .button.primary { background: var(--blue); color: #fff; }
      .button.primary:hover { background: #3158bf; }
      .button.secondary { background: var(--white); color: var(--graphite); }
      .button.secondary:hover { background: #ededed; }
      .section { display: grid; min-height: 100vh; place-items: center; padding: 96px 32px; }
      .section-inner { width: min(100%, 900px); }
      .section-kicker { margin: 0 0 8px; color: var(--pewter); }
      h2 { margin: 0; font-size: 40px; line-height: 1.2; }
      .about { background: var(--white); }
      .about-copy { max-width: 520px; margin: 24px 0 0; color: var(--graphite); font-size: 18px; line-height: 1.55; }
      .details { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 56px; }
      .detail { padding-top: 16px; border-top: 1px solid var(--line); }
      .detail h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; }
      .detail p { margin: 0; color: var(--pewter); line-height: 1.43; }
      .interests { background: var(--ash); }
      .interest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; }
      .interest { min-height: 210px; padding: 24px; border-radius: 12px; color: var(--white); background-color: var(--carbon); background-size: cover; background-position: center; }
      .interest:first-child { background-image: url("assets/seoul-hero.png"); }
      .interest:last-child { background-color: #393c41; }
      .interest p { margin: 0; font-size: 16px; font-weight: 500; }
      .interest span { display: block; margin-top: 8px; color: rgba(255, 255, 255, .8); line-height: 1.43; }
      @media (max-width: 767px) { .nav { padding: 0 16px; } .nav-links { display: none; } h1, h2 { font-size: 28px; } .hero p { font-size: 14px; } .actions, .details, .interest-grid { width: 100%; grid-template-columns: 1fr; } .actions { flex-direction: column; } .button { width: 100%; } .section { padding: 80px 16px; } .about-copy { font-size: 16px; } }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="주요 메뉴">
      <a class="wordmark" href="#home">지원</a>
      <div class="nav-links"><a href="#about">소개</a><a href="#interests">좋아하는 것</a></div>
      <button class="theme-toggle" type="button" aria-pressed="false">다크 모드</button>
    </nav>
    <main>
      <section class="hero" id="home">
        <div class="hero-content"><h1>장지원</h1><p>서울대학교 첨단융합학부<br />재학 중입니다.</p><div class="actions"><a class="button primary" href="#about">자세히 보기</a></div></div>
      </section>
      <section class="section about" id="about"><div class="section-inner"><p class="section-kicker">about</p><h2>배우고, 만들고,<br />나만의 속도로 나아갑니다.</h2><p class="about-copy">서울대학교 첨단융합학부에서 새로운 기술과 가능성을 배우고 있습니다. 조용한 시간에는 게임을 하거나 푹 자는 것을 좋아합니다.</p><div class="details"><article class="detail"><h3>학교</h3><p>서울대학교<br />첨단융합학부 재학 중</p></article><article class="detail"><h3>지금 좋아하는 것</h3><p>좋은 게임 한 판<br />그리고 충분한 휴식</p></article></div></div></section>
      <section class="section interests" id="interests"><div class="section-inner"><p class="section-kicker">interests</p><h2>작은 즐거움</h2><div class="interest-grid"><article class="interest"><p>게임</p><span>새로운 세계를 탐험하고, 함께 플레이하는 시간</span></article><article class="interest"><p>잠</p><span>다음 날을 위한 가장 확실한 충전</span></article></div></div></section>
    </main>
    <script>
      const themeButton = document.querySelector(".theme-toggle");
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";

      function updateThemeButton() {
        const isDark = document.documentElement.dataset.theme === "dark";
        themeButton.textContent = isDark ? "라이트 모드" : "다크 모드";
        themeButton.setAttribute("aria-pressed", String(isDark));
      }

      themeButton.addEventListener("click", () => {
        const isDark = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = isDark ? "light" : "dark";
        localStorage.setItem("theme", isDark ? "light" : "dark");
        updateThemeButton();
      });
      updateThemeButton();
    </script>
  </body>
</html>
